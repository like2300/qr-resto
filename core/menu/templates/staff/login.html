{% extends 'staff/base.html' %}

{% block title %}Connexion - Gestion Restaurant{% endblock %}

{% block login_content %}
<div class="w-full max-w-md">
    <div class="bg-white p-8 border border-gray-200">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 flex items-center justify-center bg-gray-900">
                <i class="ri-restaurant-2-line text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-serif uppercase tracking-widest">Gestion Restaurant</h1>
            <p class="text-xs uppercase tracking-widest text-gray-500 mt-3">Interface de gestion</p>
        </div>

        <!-- Error message -->
        {% if error %}
        <div class="mb-6 p-4 bg-red-50 border border-red-200">
            <div class="flex items-center gap-2 text-red-700">
                <i class="ri-error-warning-line"></i>
                <span class="text-sm">{{ error }}</span>
            </div>
        </div>
        {% endif %}

        <!-- Login form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">
                    <i class="ri-user-line mr-1"></i> Nom d'utilisateur
                </label>
                <input type="text" name="username" required
                       class="w-full px-4 py-3 border border-gray-200 text-sm"
                       placeholder="votre.nom">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">
                    <i class="ri-lock-line mr-1"></i> Mot de passe
                </label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 border border-gray-200 text-sm"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 bg-gray-900 hover:bg-gray-800 text-white text-xs uppercase tracking-widest transition-colors flex items-center justify-center gap-2">
                <i class="ri-login-circle-line"></i>
                Se connecter
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-xs uppercase tracking-widest text-gray-500">Accès réservé au personnel</p>
        </div>
    </div>
</div>
{% endblock %}
